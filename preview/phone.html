<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow"><title>Phone preview</title>
<style>
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;gap:40px;background:#1d2b20;font:15px/1.5 system-ui,sans-serif;color:#efe8dd}
.phone{width:390px;height:844px;border:12px solid #0d0d0d;border-radius:46px;overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,.5);background:#000;flex:none}
.phone iframe{width:100%;height:100%;border:0;display:block}
.note{max-width:260px}
@media(max-height:900px){.phone{transform:scale(.86);transform-origin:center}}
</style></head><body>
<div class="phone"><iframe src="/preview/zoom.html?phone=1" title="Homepage preview at iPhone size"></iframe></div>
<p class="note">iPhone-size preview (390 × 844). Scroll inside the phone with your trackpad or mouse wheel. Your own phone is still the truest test: open retreatblueprintco.com/preview/zoom.html there.</p>
</body></html>
